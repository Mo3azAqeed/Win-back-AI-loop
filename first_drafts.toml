# The founder's approved first drafts: the hand-written email for each segment, and the
# words the AI loop starts from. {braces} are filled in for each merchant.

[idle]
subject = "Your new store is one clone away"
body = "Hi {first_name}, you signed up but haven't started a store yet. Clone a store to start from, then make every page yours with the section builder. Your first draft takes a few minutes."
cta = "Start my first draft"

[drafter]
subject = "{store_name} is ready to go live"
body = "Hi {first_name}, your draft of {store_name} is saved and waiting. Publishing takes one click and starts your 7-day free trial. You won't pay anything until the trial ends."
cta = "Publish my store"

[trialist]
subject = "Keep {store_name} live after your trial"
body = "Hi {first_name}, {store_name} is live. Your free trial ends on {trial_end_date}. Keep your store and the section builder for $40/month."
cta = "Keep my store live"

# Added to the Trialist first draft only when the AI loop picks that offer (#8).
[trialist.offer_lines]
extension = "Need more time? We've added 7 more days to your trial."
discount = "Your first month is $20 instead of $40."
