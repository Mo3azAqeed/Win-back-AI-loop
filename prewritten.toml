# The stand-in writer (#7): real subjects and bodies written to the fact sheet. Each new challenger is
# the champion with one part changed: the next subject, then the next body, in turn (#34). Each comes
# with its hypothesis: the one change it makes and why. Until the real writer arrives (#13).
#
# drafter and trialist are the same change in those segments' own words (with their buttons for a
# body): when an Idle test crowns it, their emails borrow it (#36).
#
# quality is each one's hidden quality for Idle merchants, where 100 is your first draft:
# 120 means 20% more reads (subject) or clicks (body). Every quality is a placeholder, made up
# for the simulation; only real sends could measure it.

[[subject]]
text = "Start your store from one you already like"
drafter = "You started {store_name} from a store you liked"
trialist = "Keep the store you built from one you liked"
hypothesis = "Leads with starting from a store they already like, because Idle merchants haven't pictured their own store yet."
quality = { value = 110, placeholder = true }

[[subject]]
text = "Your store, a few minutes away"
drafter = "{store_name} is a moment away from going live"
trialist = "Keeping {store_name} live takes a moment"
hypothesis = "Promises speed, because an empty store feels like hours of work."
quality = { value = 90, placeholder = true }

[[subject]]
text = "Clone a store, then make it yours"
drafter = "You cloned a store. Now put {store_name} live"
trialist = "You cloned it and made it yours: keep {store_name}"
hypothesis = "Names store cloning in the subject, because it is what sets the app apart."
quality = { value = 120, placeholder = true }

[[subject]]
text = "{first_name}, your first draft is waiting to be started"
drafter = "{first_name}, your draft is waiting to be published"
trialist = "{first_name}, your trial ends on {trial_end_date}"
hypothesis = "Uses their name and names the next step, because a small, personal task feels easier to start."
quality = { value = 105, placeholder = true }

[[subject]]
text = "Skip the blank page"
drafter = "Skip the wait: publish {store_name}"
trialist = "Don't lose {store_name}"
hypothesis = "Short, and names the pain, because the blank page is why Idle merchants stall."
quality = { value = 130, placeholder = true }

[[subject]]
text = "Build every page with the section builder"
drafter = "Finish every page with the section builder"
trialist = "Keep the section builder after your trial"
hypothesis = "Leads with the section builder, to see whether control over every page draws more interest than cloning."
quality = { value = 85, placeholder = true }

[[subject]]
text = "Still thinking about your store?"
drafter = "Still thinking about publishing {store_name}?"
trialist = "Still deciding about {store_name}?"
hypothesis = "Asks a soft question, to see whether a gentle nudge beats naming a feature."
quality = { value = 95, placeholder = true }

[[subject]]
text = "One clone, then it's all yours"
drafter = "{store_name} is all yours. Publish it"
trialist = "{store_name} is all yours. Keep it"
hypothesis = "Stresses that the store is theirs after cloning, because merchants may fear a clone won't feel like their own."
quality = { value = 115, placeholder = true }

[[body]]
text = "Hi {first_name}, pick a store you like and clone it to start from. Then change every page with the section builder until it's yours."
cta = "Clone a store"
drafter = "Hi {first_name}, your draft of {store_name} is saved. Check every page with the section builder, then publish. Your 7-day free trial starts when you publish."
drafter_cta = "Publish my store"
trialist = "Hi {first_name}, {store_name} is live. To keep it that way, choose the plan before your trial ends on {trial_end_date}: $40/month, with the section builder."
trialist_cta = "Keep my store live"
hypothesis = "Walks through the two steps (clone, then edit), because a clear path makes starting feel small."
quality = { value = 115, placeholder = true }

[[body]]
