AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup. Emails you when this account's AWS spending passes a monthly limit.
  Deploy it to us-east-1: AWS Budgets is a global service, and CloudFormation offers
  its resource type only there, not in every region.

Parameters:
  AlertEmail:
    Type: String
    Description: Who gets the budget alert.
    AllowedPattern: ".+@.+"
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: Email an alert when this month's AWS spending goes above this.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: winback-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes:
          IncludeCredit: false  # otherwise the Free plan's credits hide every dollar spent
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
