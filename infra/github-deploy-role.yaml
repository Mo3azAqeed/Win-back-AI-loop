AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup. Lets GitHub Actions deploy the win-back stack from the main branch,
  signing in with OIDC so no AWS keys are stored in GitHub.

Parameters:
  GitHubOwner:
    Type: String
    Default: Mo3azAqeed
    Description: The GitHub account that owns the repository allowed to deploy.
  GitHubOwnerId:
    Type: String
    Default: "143059688"
    Description: That account's numeric GitHub ID (never changes, even if the account is renamed).
  GitHubRepoName:
    Type: String
    Default: Win-back-AI-loop
    Description: The repository allowed to deploy.
  GitHubRepoId:
    Type: String
    Default: "1429001468"
    Description: That repository's numeric GitHub ID (never changes, even if it is renamed).
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this AWS account already has the GitHub OIDC provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-winback  # outside winback-*, so it cannot edit its own permissions
      Description: Assumed by GitHub Actions on the main branch to run sam deploy.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub names the workflow in one of two formats: the classic one, and (for repositories
              # created from July 2026) one carrying the owner's and repository's permanent IDs.
              StringEqualsIgnoreCase:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${GitHubRepoName}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepoName}@${GitHubRepoId}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-winback-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunCloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource: "*"
              - Sid: ArtifactAndReportBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*"
                  - !Sub "arn:${AWS::Partition}:s3:::winback-*"
              - Sid: TheFunction
                Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:winback-*"
              - Sid: AlertsTopic
                Effect: Allow
                Action: sns:*
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:winback-alerts*"
              - Sid: ScheduleAlarmsLogs
                Effect: Allow
                Action:
                  - scheduler:*
                  - cloudwatch:*
                  - logs:*
                Resource: "*"
              - Sid: RolesTheStackCreatesMustCarryTheBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/winback-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref RoleBoundary
              - Sid: RolesTheStackCreates
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/winback-*"
              - Sid: TheBoundaryStays
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"

  # The most any role in the win-back stack can ever do, whatever policies it is given.
  # Without it, the deploy role could create a winback-* role with admin rights and use it.
  RoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: winback-role-boundary
      Description: Permissions boundary for every role the win-back stack creates.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteAndReadReports
            Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::winback-*/*"
          - Sid: ListReports
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::winback-*"
          - Sid: SendAlerts
            Effect: Allow
            Action: sns:Publish
            Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:winback-alerts"
          - Sid: ReadTheOpenRouterKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/winback/*"
          - Sid: WriteLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:winback-*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:winback-*:*"
          - Sid: ScheduleStartsTheFunction
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:winback-*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:winback-*:*"

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
