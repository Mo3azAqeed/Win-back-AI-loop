[project]
name = "winback"
version = "0.1.0"
description = "Win-back AI loop: milestone 1 simulation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
winback = "winback.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winback"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
