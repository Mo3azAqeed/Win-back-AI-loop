# Win-back simulation settings.
#
# Every number is written as { value = ..., placeholder = true | false }.
# placeholder = true means the number is made up for the simulation and
# should be replaced with real data when we have it.

[merchants]
start = { value = 1000, placeholder = false, note = "Merchants today (founder's figure)." }
start_alternative = { value = 1500, placeholder = false, note = "Second starting size the simulation also runs (founder's figure)." }
already_paying_share = { value = 0.15, placeholder = true, note = "Share of existing merchants who already pay; counted but not simulated." }
existing_idle_share = { value = 0.50, placeholder = true, note = "Share of existing merchants who are Idle today." }
existing_drafter_share = { value = 0.25, placeholder = true, note = "Share of existing merchants who are Drafters today." }
existing_trialist_share = { value = 0.10, placeholder = true, note = "Share of existing merchants who are Trialists today." }
existing_spread_days = { value = 14, placeholder = false, note = "Existing merchants enter their segment spread over this many days, so their emails don't go out in a burst." }

[growth]
weeks = { value = 13, placeholder = false, note = "Length of the simulation in weeks." }
first_week = { value = 0.10, placeholder = false, note = "Weekly growth in week 1 (founder's forecast)." }
last_week = { value = 0.08, placeholder = false, note = "Weekly growth in the last week (founder's forecast)." }

[holdout]
share = { value = 0.08, placeholder = false, note = "Share of merchants held out for life: never sent a win-back email, so their goal rate is the measured baseline (founder's choice)." }

[sending]
min_gap_days = { value = 2, placeholder = false, note = "At least this many days between any two emails to the same merchant." }

[trial]
days = { value = 7, placeholder = false, note = "The free trial starts at publish and lasts this many days." }

[paid]
monthly_price = { value = 40, placeholder = false, note = "The one plan's price; each payment is this much first-month revenue." }
window_days = { value = 30, placeholder = false, note = "Paid conversion is tracked for this many days after a merchant enters each segment." }

[idle]
horizon_days = { value = 8, placeholder = false, note = "Idle horizon: true lift counts a draft started within this many days of entering Idle." }
miss_window_days = { value = 3, placeholder = false, note = "An Idle email is a miss if no draft is started within this many days of the email." }
hand_written_after_days = { value = 2, placeholder = false, note = "The hand-written Idle email (your first draft) goes out this many days after entering Idle (signup, for new merchants)." }
organic_share = { value = 0.12, placeholder = true, note = "Share of Idle merchants who would start a draft one day with no email." }
organic_mean_days = { value = 2.5, placeholder = true, note = "Average days until those merchants start a draft on their own." }
read_rate = { value = 0.35, placeholder = true, note = "Chance an Idle merchant reads your first draft (hidden quality 100)." }
click_rate = { value = 0.20, placeholder = true, note = "Chance a reader clicks your first draft's button (hidden quality 100)." }
act_rate = { value = 0.25, placeholder = true, note = "Chance a merchant who clicks then starts a draft." }
response_mean_days = { value = 0.3, placeholder = true, note = "Average days between clicking and starting the draft." }
read_shift_1_hour = { value = 0.4, placeholder = true, note = "How an email sent 1 hour after the trigger changes reading, on the log-odds scale, against +2 days (0). Idle merchants read best soon after signing up." }
read_shift_5_days = { value = -0.5, placeholder = true, note = "How an email sent 5 days after the trigger changes reading, on the log-odds scale, against +2 days (0)." }

[drafter]
horizon_days = { value = 12, placeholder = false, note = "Drafter horizon: true lift counts a publish within this many days of the draft save." }
miss_window_days = { value = 7, placeholder = false, note = "A Drafter email is a miss if the store isn't published within this many days of the email." }
hand_written_after_days = { value = 2, placeholder = false, note = "The hand-written Drafter email goes out this many days after the draft is saved." }
organic_share = { value = 0.30, placeholder = true, note = "Share of Drafters who would publish one day with no email." }
organic_mean_days = { value = 3, placeholder = true, note = "Average days until those Drafters publish on their own." }
read_rate = { value = 0.43, placeholder = true, note = "Chance a Drafter reads your Drafter first draft (hidden quality 100)." }
click_rate = { value = 0.20, placeholder = true, note = "Chance a reader clicks your Drafter first draft's button (hidden quality 100)." }
act_rate = { value = 0.30, placeholder = true, note = "Chance a Drafter who clicks then publishes." }
response_mean_days = { value = 0.3, placeholder = true, note = "Average days between clicking and publishing." }
read_shift_1_hour = { value = -0.5, placeholder = true, note = "How an email sent 1 hour after the trigger changes reading, on the log-odds scale, against +2 days (0). Drafters read best a couple of days after saving." }
read_shift_5_days = { value = -0.3, placeholder = true, note = "How an email sent 5 days after the trigger changes reading, on the log-odds scale, against +2 days (0)." }

[trialist]
horizon_days = { value = 14, placeholder = false, note = "Trialist horizon: true lift counts a paid conversion within this many days of publishing." }
miss_window_days = { value = 14, placeholder = false, note = "A Trialist email is a miss if the merchant hasn't paid within this many days of publishing (counted from publishing, not the email, so every offer is judged alike)." }
hand_written_after_days = { value = 2, placeholder = false, note = "The hand-written Trialist email goes out this many days after publishing." }
organic_share = { value = 0.242, placeholder = true, note = "Share of Trialists who would pay one day with no email; with the 4-day average below, about 20% pay inside the 7-day trial." }
organic_mean_days = { value = 4, placeholder = true, note = "Average days after publishing until those Trialists pay; only payments inside the trial count." }
read_rate = { value = 0.50, placeholder = true, note = "Chance a Trialist reads your Trialist first draft (hidden quality 100)." }
click_rate = { value = 0.20, placeholder = true, note = "Chance a reader clicks your Trialist first draft's button (hidden quality 100)." }
act_rate = { value = 0.25, placeholder = true, note = "Chance a Trialist who clicks then pays." }
response_mean_days = { value = 0.3, placeholder = true, note = "Average days between clicking and paying." }
read_shift_1_hour = { value = -0.5, placeholder = true, note = "How an email sent 1 hour after the trigger changes reading, on the log-odds scale, against +2 days (0). Trialists read slightly better later in the trial." }
read_shift_5_days = { value = 0.1, placeholder = true, note = "How an email sent 5 days after the trigger changes reading, on the log-odds scale, against +2 days (0)." }

[ai_loop]
active_variants = { value = 2, placeholder = false, note = "The AI loop tests at most this many Idle subjects, and this many bodies, at a time." }
min_sends = { value = 120, placeholder = false, note = "A variant is judged only once it and the leader each have this many sends; until then the variants in play share Idle traffic evenly." }
retire_confidence = { value = 0.9, placeholder = false, note = "A variant is retired once the leader is this likely to be better." }
prior_sends = { value = 10, placeholder = false, note = "A replacement starts as if it had this many sends at its slot's average: cautious, so it must earn its traffic." }
