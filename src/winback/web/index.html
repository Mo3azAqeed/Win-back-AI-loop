      <li class="flex items-center gap-2 cursor-pointer hover:text-ink" role="button" tabindex="0" data-stage="trialist"><span class="w-1.5 h-1.5 rounded-full bg-win"></span>STG-03 Trialist<span data-delta class="ml-auto"></span></li>

<script>
"use strict";
const STAGES = { idle: { label: "Idle", dot: "bg-amber", goal: "start a draft" }, drafter: { label: "Drafter", dot: "bg-indigo", goal: "publish" }, trialist: { label: "Trialist", dot: "bg-win", goal: "pay" } };
const COLOUR = { no_email: "#71717A", hand_written: "#F59E0B", ai_loop: "#5E6AD2" };
const NAME = { no_email: "No email", hand_written: "Your email", ai_loop: "AI loop" };
const SEND_AFTER = ["1 hour", "2 days", "5 days"];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const view = document.getElementById("view");
let timers = [];

// ---------- small helpers ----------
function h(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function svg(tag, attrs = {}, ...kids) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  for (const k of kids.flat()) if (k) n.append(k);
  return n;
}
const pts = v => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1);
const pct = v => v == null ? "–" : (100 * v).toFixed(1) + "%";
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const num = v => Number(v).toLocaleString("en-US");
const day = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
// A card; an optional plain object after the classes holds extra attributes (such as an animation delay).
const card = (cls, ...kids) => {
  const attrs = kids[0] && kids[0].constructor === Object ? kids.shift() : {};
  return h("section", { ...attrs, class: "bg-card border border-hair rounded-xl fade-up " + (cls || "") }, ...kids);
};
const label = text => h("div", { class: "text-[11px] tracking-widest uppercase text-faint font-mono" }, text);
function store(key, value) { try { if (value === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(value)); } catch { return null; } }
async function api(path, options) {
  const r = await fetch(path, options);
  const t = await r.text();
  let b; try { b = JSON.parse(t); } catch { b = t; }
  if (!r.ok) throw new Error((b && b.error) || "Something went wrong (" + r.status + ")");
  return b;
}
function countUp(el, to, fmt) {
  if (reduced) { el.textContent = fmt(to); return; }
  const start = performance.now();
  const tick = now => { const p = Math.min(1, (now - start) / 900); el.textContent = fmt(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
// Text with {placeholders} shown as chips; all text goes in as text, never as markup.
function withChips(text) {
  return text.split(/(\{[a-z_]+\})/g).filter(Boolean).map(part => /^\{[a-z_]+\}$/.test(part) ? h("span", { class: "chip" }, part) : part);
}
// Word-level difference between two texts: kept words plain, new words highlighted, removed words struck.
function diffWords(before, after) {
  const a = before.split(/(\s+)/), b = after.split(/(\s+)/);
  const m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  // Mostly rewritten: word-by-word marks would be noise, so show the new words whole and the old ones below.
  const words = s => s.filter(w => !/^\s+$/.test(w)).length;
  if (L[0][0] / 2 < 0.4 * Math.max(words(a), words(b))) {
    return [h("span", { class: "added" }, withChips(after)), h("span", { class: "block mt-1 text-xs removed" }, before)];
  }
  const out = []; let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && a[i] === b[j]) { out.push(h("span", {}, withChips(b[j]))); i++; j++; }
    else if (j < n && (i >= m || L[i][j + 1] >= L[i + 1][j])) { out.push(/^\s+$/.test(b[j]) ? b[j] : h("span", { class: "added" }, withChips(b[j]))); j++; }
    else { if (!/^\s+$/.test(a[i])) out.push(h("span", { class: "removed" }, a[i]), " "); i++; }
  }
  return out;
}
function delta(v, unit = " pts") {
  if (v == null) return h("span", { class: "text-faint" }, "–");
  const cls = v > 0.05 ? "text-win" : v < -0.05 ? "text-soft" : "text-soft";
  return h("span", { class: "font-mono " + cls }, pts(v) + unit);
}
function setNav(name, crumb) {
  document.getElementById("actions").replaceChildren();
  if (name !== "run") document.querySelectorAll("[data-delta]").forEach(el => el.textContent = "");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("bg-elevated", a.dataset.nav === name));
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("text-ink", a.dataset.nav === name));
  document.getElementById("crumb").textContent = crumb;
}
function clearTimers() { timers.forEach(clearInterval); timers = []; }

// ---------- Compose ----------
async function showCompose() {
  setNav("compose", "Write your emails");
  view.replaceChildren(h("div", { class: "text-soft" }, "Loading your drafts…"));
  let emails = store("winback-emails");
  if (!emails) { try { emails = (await api("/api/drafts")).emails; } catch (e) { view.replaceChildren(h("p", { class: "text-soft" }, e.message)); return; } }
  const settings = store("winback-run") || { replays: 20 };
  const save = () => store("winback-emails", emails);

  const editor = (email, index) => {
    const stage = STAGES[email.segment];
    const preview = h("div");
    const words = h("span", { class: "text-[11px] font-mono text-faint" });
    const render = () => (words.textContent = `${(email.body.match(/\S+/g) || []).length} words`, preview.replaceChildren(
      h("div", { class: "font-semibold text-ink truncate" }, withChips(email.subject || " ")),
      h("div", { class: "text-soft text-sm mt-1 leading-relaxed" }, withChips(email.body || " ")),
      h("span", { class: "inline-block mt-3 text-sm px-3 py-1.5 rounded-md bg-ink text-canvas font-medium" }, email.cta || " ", " →")));

    const field = (key, area) => {
      const attrs = { class: "w-full bg-shell border border-hair rounded-lg px-3 py-2 text-[15px] focus:outline-none focus:border-indigo/70 focus:ring-2 focus:ring-indigo/20 transition", value: email[key], "aria-label": key };
      const input = area ? h("textarea", { ...attrs, rows: 6 }) : h("input", attrs);
      if (area) input.value = email[key];
      input.addEventListener("input", () => { email[key] = input.value; save(); render(); ready(); });
      return input;
    };
    const timing = h("div", { class: "flex rounded-lg border border-hair p-0.5 text-xs" }, SEND_AFTER.map(t => {
      const b = h("button", { class: "px-2.5 py-1 rounded-md transition " + (email.send_after === t ? "bg-elevated text-ink" : "text-soft hover:text-ink"), type: "button" }, t);
      b.onclick = () => { email.send_after = t; save(); showCompose(); };
      return b;
    }));
    return card("flex flex-col overflow-hidden scroll-mt-20", { id: "email-" + email.segment, style: `animation-delay:${index * 70}ms` },
      h("div", { class: "flex items-center justify-between gap-2 px-5 py-4 border-b border-hair" },
        h("div", { class: "flex items-center gap-2 font-mono text-sm" }, h("span", { class: `w-2 h-2 rounded-full ${stage.dot}` }), stage.label),
        h("span", { class: "text-xs px-2 py-0.5 rounded border border-hair text-soft" }, "Goal: " + stage.goal)),
      h("div", { class: "p-5 space-y-4 flex-1" },
        h("div", { class: "flex items-center justify-between gap-3" }, h("span", { class: "text-sm text-soft" }, "Send after"), timing),
        h("div", {}, label("Subject line"), h("div", { class: "mt-1.5" }, field("subject"))),
        h("div", {}, h("div", { class: "flex justify-between" }, label("Body"), words), h("div", { class: "mt-1.5" }, field("body", true))),
        h("div", {}, label("Button"), h("div", { class: "mt-1.5" }, field("cta")))),
      h("div", { class: "px-5 py-4 border-t border-hair bg-shell/60" }, label("Inbox preview"), h("div", { class: "mt-2 p-4 rounded-lg bg-elevated border border-hair" }, preview)));
  };

  const code = h("input", { type: "password", autocomplete: "off", placeholder: "Access code", "aria-label": "Access code", value: store("winback-code") || "", class: "bg-shell border border-hair rounded px-2.5 h-8 text-sm w-36 font-mono focus:outline-none focus:border-edge" });
  const size = h("div", { class: "flex rounded border border-hair p-0.5 text-xs font-mono" }, [[20, "20 replays"], [200, "200 replays"]].map(([n, t]) => {
    const b = h("button", { type: "button", title: n === 20 ? "Quick: about a minute" : "Full: a few minutes", class: "px-2.5 h-7 rounded " + (settings.replays === n ? "bg-elevated text-ink" : "text-soft hover:text-ink") }, t);
    b.onclick = () => { settings.replays = n; store("winback-run", { replays: n }); size.querySelectorAll("button").forEach((x, i) => x.className = "px-2.5 h-7 rounded " + ([20, 200][i] === n ? "bg-elevated text-ink" : "text-soft hover:text-ink")); };
    return b;
  }));
  const status = h("span", { class: "text-sm text-soft", role: "status" });
  const simulate = async button => {
    store("winback-code", code.value.trim());
    if (!code.value.trim()) { status.textContent = "Enter the access code first."; code.focus(); return; }
    document.querySelectorAll("[data-go]").forEach(b => b.disabled = true); status.textContent = "Starting…";
    try {
      const started = await api("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: code.value.trim(), replays: settings.replays, emails }) });

    } catch (e) { status.textContent = e.message; document.querySelectorAll("[data-go]").forEach(b => b.disabled = false); }
  };
  const goTop = h("button", { type: "button", "data-go": true, class: "h-8 px-3 rounded bg-ink text-canvas text-sm font-medium hover:bg-ink/90 disabled:opacity-50" }, "Simulate 13 weeks ↵");
  goTop.onclick = simulate;
  const go = h("button", { type: "button", "data-go": true, class: "h-9 px-4 rounded bg-indigo hover:bg-indigo/90 text-white text-sm font-medium disabled:opacity-50" }, "Simulate 13 weeks");
  go.onclick = simulate;
  const reset = h("button", { type: "button", class: "h-8 px-3 rounded border border-hair text-xs text-soft hover:text-ink hover:border-edge" }, "Reset to saved drafts");
  reset.onclick = () => { try { localStorage.removeItem("winback-emails"); } catch {} showCompose(); };
  const readyText = h("span", { class: "text-sm text-soft" });
  const ready = () => {
    const complete = emails.filter(e => e.subject.trim() && e.body.trim() && e.cta.trim()).length;
    readyText.textContent = `${complete}/3 emails complete · ${settings.replays === 200 ? "full run, a few minutes" : "quick run, about a minute"}`;
  };
  ready();
  const variables = new Set(emails.flatMap(e => (e.subject + " " + e.body).match(/\{[a-z_]+\}/g) || []));
  document.getElementById("actions").replaceChildren(size, code, goTop);

  const phoneControls = h("div", { class: "flex md:hidden flex-wrap gap-2" }, size.cloneNode(true), code.cloneNode(true));
  phoneControls.querySelectorAll("button").forEach((b, i) => b.onclick = () => size.querySelectorAll("button")[i].click());
  phoneControls.querySelector("input").addEventListener("input", e => { code.value = e.target.value; });

    h("div", { class: "fade-up flex flex-col lg:flex-row lg:items-start gap-4 justify-between" },
      h("div", {}, h("h1", { class: "text-3xl font-medium tracking-tight" }, "Your win-back emails"),
        h("p", { class: "text-soft mt-2 max-w-2xl" }, "Write one email per stalled stage. The simulation sends yours to the same merchants as an AI loop that starts from your words and keeps rewriting them, across 13 weeks.")),
      h("div", { class: "flex gap-2 items-center" }, tag("Auto-saved in this browser", "border border-hair text-soft py-1"), tag(`${variables.size} variables`, "border border-win/30 text-win py-1"), reset)),
    h("div", { class: "mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-[12px] font-mono text-soft fade-up" },
      h("span", { class: "flex items-center gap-2" }, h("span", { class: "w-2 h-2 rounded-full bg-win" }), "Simulated merchants: 1,000 and 1,500 today, plus 13 weeks of signups"),
      h("span", { class: "md:ml-auto flex gap-3" }, Object.entries(STAGES).map(([k, v], i) => h("span", { class: "flex items-center gap-1.5" }, h("span", { class: `w-1.5 h-1.5 rounded-full ${v.dot}` }), `STG-0${i + 1} (${v.label})`)))),
    h("div", { class: "grid gap-4 mt-5 lg:grid-cols-3" }, emails.map(editor)),
    card("mt-6 p-4 flex flex-col md:flex-row md:items-center gap-3 sticky bottom-4 shadow-2xl shadow-black/40 bg-elevated/95 backdrop-blur",
      h("div", { class: "flex items-center gap-3 flex-1" }, h("span", { class: "font-medium" }, "Ready for simulation"), h("span", { class: "text-faint" }, "|"), readyText),
      phoneControls, status, go),

// ---------- Running ----------
async function showRunning(name) {
  setNav("running", "Simulation run");
  const startedAt = Date.now();
  let replays = 20;
  try { const runs = await api("/api/runs"); const mine = runs.running.find(r => r.run === name); if (mine) replays = mine.replays; } catch {}
  const expected = replays >= 100 ? 300 : 75; // seconds a run usually takes on AWS Lambda
  const elapsed = h("span", { class: "font-mono text-soft text-sm" }, "0:00 elapsed");
  const bar = h("div", { class: "h-full bg-indigo transition-all duration-1000", style: "width:2%" });
  const progress = h("span", { class: "font-mono text-sm text-soft" }, "Starting");
  const node = (x, y, w, label, sub, colour) => svg("g", {},
    svg("rect", { x, y, width: w, height: 40, rx: 5, fill: "#121316", stroke: colour }),
    svg("circle", { cx: x + 16, cy: y + 20, r: 3.5, fill: colour }),
    svg("text", { x: x + 28, y: y + 17, fill: colour, "font-size": 10, "font-family": "JetBrains Mono" }, document.createTextNode(label)),
    svg("text", { x: x + 28, y: y + 30, fill: "#F7F8F8", "font-size": 11, "font-family": "Inter" }, document.createTextNode(sub)));
  const diagram = svg("svg", { viewBox: "0 0 480 190", class: "w-full", "aria-hidden": "true" },
    svg("path", { d: "M190 40 C110 50 100 80 100 112", fill: "none", stroke: "#5E626A", "stroke-dasharray": "4 4", class: "draw", style: "--len:300" }),
    svg("path", { d: "M240 60 L240 112", fill: "none", stroke: "#5E6AD2", "stroke-dasharray": "4 4", class: "draw", style: "--len:300" }),
    svg("path", { d: "M290 40 C370 50 380 80 380 112", fill: "none", stroke: "#3FB950", "stroke-dasharray": "4 4", class: "draw", style: "--len:300" }),
    svg("rect", { x: 160, y: 20, width: 160, height: 40, rx: 5, fill: "#17181C", stroke: "rgba(255,255,255,.16)" }),
    svg("text", { x: 176, y: 45, fill: "#8A8F98", "font-size": 10, "font-family": "JetBrains Mono" }, document.createTextNode("BASE")),
    svg("text", { x: 214, y: 45, fill: "#F7F8F8", "font-size": 12, "font-family": "Inter", "font-weight": 500 }, document.createTextNode("Your merchants")),
    node(40, 112, 120, "STG-01", "Idle", "#F59E0B"), node(180, 112, 120, "STG-02", "Drafter", "#5E6AD2"), node(320, 112, 120, "STG-03", "Trialist", "#3FB950"),

  return h("div", { class: "overflow-x-auto" }, h("table", { class: "w-full text-sm min-w-[860px]" },

    h("tbody", {}, rows)));
}

function playbookTable(loop) {
  if (!loop.playbook.length) return h("p", { class: "text-sm text-faint" }, "No test has ended yet.");
  return h("div", { class: "overflow-x-auto" }, h("table", { class: "w-full text-sm min-w-[860px]" },
    h("thead", {}, h("tr", { class: "text-left text-faint text-[11px] uppercase tracking-wider font-mono" }, ["Test", "Weeks", "Versions", "Hypothesis", "Ending", "Conclusion"].map(t => h("th", { class: "p-3 font-medium" }, t)))),
    h("tbody", {}, loop.playbook.map(e => h("tr", { class: "border-t border-hair align-top" },
      h("td", { class: "p-3 font-mono text-soft" }, "#" + e.test),
      h("td", { class: "p-3 font-mono text-soft whitespace-nowrap" }, `W${e.started_week}–W${e.ended_week}`),
      h("td", { class: "p-3 font-mono whitespace-nowrap" }, `v${e.champion} vs v${e.challenger}`),

      h("td", { class: "p-3 text-soft max-w-md" }, e.conclusion))))));
}

async function showRun(name) {

  };

    clearTimers();
    const start = run.starts[startIndex], seg = start.segments[stageIndex], loop = start.loop;
    const yourEmail = run.first_drafts.find(d => d.segment === seg.segment);
    const count = journeyCounts(start);
    const paidGain = count.ai_loop[3] - count.hand_written[3];
    const won = start.segments.filter(s => s.ai_did_better);
    const revenueGain = start.revenue.ai_loop - start.revenue.hand_written;
    document.querySelectorAll("[data-stage]").forEach(li => {
      const s = start.segments.find(x => x.segment === li.dataset.stage), ai = s.approaches.find(a => a.approach === "ai_loop"), hand = s.approaches.find(a => a.approach === "hand_written");

      li.querySelector("[data-delta]").className = "ml-auto font-mono text-[11px] " + (s.ai_did_better ? "text-win" : "text-faint");
    });

    // 1. The decision brief
    const big = (value, fmt, cls) => { const el = h("span", { class: "text-4xl font-medium tracking-tight " + cls }); countUp(el, value, fmt); return el; };
    const kpi = (labelText, chip, value, unit, foot) => h("div", { class: "p-5 border-hair md:border-r last:border-r-0" },
      h("div", { class: "flex items-center justify-between gap-2" }, h("span", { class: "text-[11px] font-mono uppercase tracking-wider text-faint" }, labelText), chip),
      h("div", { class: "mt-3 flex items-baseline gap-2" }, value, h("span", { class: "text-soft text-sm" }, unit)),

    const idle = start.segments[0];
    const brief = card("p-5 md:p-7",
      h("div", { class: "flex flex-wrap gap-2" }, tag("EXECUTIVE DECISION BRIEF", "border border-hair text-faint"),
        tag(`AI loop ahead in ${won.length} of 3 stages`, won.length >= 2 ? "bg-win/15 text-win" : "border border-hair text-soft")),
      h("h1", { class: "text-3xl md:text-[32px] font-medium tracking-tight mt-3" },
        paidGain > 0 ? `The AI loop won ${num(paidGain)} more paying merchants than your email` : paidGain === 0 ? "The AI loop and your email won the same number of paying merchants" : `Your email won ${num(-paidGain)} more paying merchants than the AI loop`),
      h("p", { class: "text-soft mt-2 max-w-3xl" }, `${num(count.ai_loop[3])} merchants paid with the AI loop, ${num(count.hand_written[3])} with your email and ${num(count.no_email[3])} with no email, from ${num(start.merchants)} merchants today plus 13 weeks of signups (first replay).`),
      h("div", { class: "mt-6 grid md:grid-cols-3 rounded-lg border border-hair bg-shell" },
        kpi("Paid stores won", tag(count.hand_written[3] ? `${pts(100 * paidGain / count.hand_written[3])}%` : "–", paidGain > 0 ? "bg-win/15 text-win" : "border border-hair text-soft"),
          big(paidGain, v => (v >= 0 ? "+" : "−") + Math.abs(Math.round(v)), paidGain > 0 ? "text-win" : "text-ink"), "stores",
          h("span", {}, "Breakdown: ", h("span", { class: "text-indigo" }, num(count.ai_loop[3]) + " AI"), " vs ", h("span", { class: "text-amber" }, num(count.hand_written[3]) + " yours"))),
        kpi("Trialist revenue", tag("first month", "bg-win/10 text-win"),
          big(revenueGain, v => (v >= 0 ? "+$" : "−$") + Math.abs(Math.round(v)).toLocaleString("en-US"), revenueGain > 0 ? "text-ink" : "text-soft"), "per replay",
          `${money(start.revenue.ai_loop)} AI vs ${money(start.revenue.hand_written)} yours, average of ${num(run.replays)} replays`),
        kpi("Idle win rate", tag("replays", "bg-indigo/15 text-indigo"),
          big(100 * idle.ai_ahead / run.replays, v => v.toFixed(1) + "%", "text-indigo"), "ahead",
          `Replays won: ${num(idle.ai_ahead)} of ${num(run.replays)} in Idle, where the AI rewrites the email`)),
      h("div", { class: "mt-6 pt-5 border-t border-hair flex flex-wrap items-center justify-between gap-3 text-[13px]" },
        h("span", { class: "text-soft" }, h("strong", { class: "text-ink font-medium" }, "Recommended next step: "),
          won.length >= 2 ? "worth a real-world test against a holdout. Every number here is simulated from placeholder assumptions." : "keep your email for now and test new versions; the simulated gain is too small to act on."),
        h("a", { href: `/api/runs/${encodeURIComponent(name)}/report`, target: "_blank", rel: "noopener", class: "h-8 px-3.5 inline-flex items-center rounded bg-indigo hover:bg-indigo/90 text-white font-medium text-[12px]" }, "Open the full report ↗")));

    // 2. Where did the improvement come from?
    const stepCard = i => {
      const ai = count.ai_loop[i], yours = count.hand_written[i], gain = ai - yours;
      return h("div", { class: "rounded-md border bg-shell p-4 " + (i === 3 ? "border-indigo/40" : "border-hair") },
        h("div", { class: "flex items-center justify-between text-[11px] font-mono text-faint" }, h("span", {}, `${i + 1} · STEP`), i ? tag(`${gain >= 0 ? "+" : "−"}${Math.abs(gain)}`, gain > 0 ? "bg-win/15 text-win" : "border border-hair text-soft") : h("span", {}, "start")),
        h("div", { class: "font-medium mt-1" }, STEPS[i]),
        h("div", { class: "mt-2 flex items-baseline gap-2 font-mono" }, h("span", { class: "text-2xl text-indigo" }, num(ai)), i ? h("span", { class: "text-faint text-xs" }, "vs " + num(yours)) : null,
          i && yours ? h("span", { class: "ml-auto text-xs " + (gain > 0 ? "text-win" : "text-faint") }, pts(100 * gain / yours) + "%") : null),
        h("div", { class: "mt-3 h-1 rounded bg-hair overflow-hidden flex" }, h("div", { class: "grow", style: `width:${100 * ai / count.ai_loop[0]}%;background:#5E6AD2` })));
    };
    const gains = [1, 2, 3].map(i => count.ai_loop[i] - count.hand_written[i]);
    const best = gains.indexOf(Math.max(...gains)) + 1;
    const journeyPanel = panel("Journey stream", "Where did the improvement come from?", `How the merchants moved through the four steps with each approach (first replay, holdout aside).`,
      h("div", { class: "flex flex-wrap gap-3 text-[11px] font-mono mb-4" }, ["no_email", "hand_written", "ai_loop"].map(a => h("span", { class: "flex items-center gap-1.5 text-soft" }, h("span", { class: "w-2.5 h-2.5 rounded-sm", style: `background:${COLOUR[a]}` }), NAME[a])), h("span", { class: "flex items-center gap-1.5 text-win" }, h("span", { class: "w-2.5 h-2.5 rounded-sm bg-win" }), "Gain over your email")),
      h("div", { class: "grid gap-3 grid-cols-2 lg:grid-cols-4" }, [0, 1, 2, 3].map(stepCard)),
      h("div", { class: "mt-4 rounded-md border border-hair bg-canvas p-3" }, ribbon(count)),
      gains[best - 1] > 0 ? h("div", { class: "mt-4 rounded-md border border-indigo/30 bg-indigo/5 p-4 text-[13px]" },
        h("div", { class: "font-medium" }, "Biggest gain: " + STEPS[best].toLowerCase()),
        h("p", { class: "text-soft mt-1" }, `The AI loop moved ${num(gains[best - 1])} more merchants than your email to "${STEPS[best].toLowerCase()}". A gain at an early step carries on down the journey, so later steps include it.`)) : null);

    // 3. What made the difference?
    const stageTabs = h("div", { class: "flex rounded border border-hair p-0.5 text-[12px] font-mono" }, start.segments.map((s, i) => {
      const b = h("button", { type: "button", class: "px-3 py-1.5 rounded " + (i === stageIndex ? "bg-indigo text-white" : "text-soft hover:text-ink") }, `STG-0${i + 1} ${s.label}`);
      b.onclick = () => { stageIndex = i; render(); };
      return b;
    }));
    const lastWeek = seg.weeks[seg.weeks.length - 1].ai.leading;
    const overall = seg.versions.ai_overall, yours = seg.versions.yours;
    const timing = loop.timings.find(t => t.segment === seg.segment && t.leading);
    const champion = seg.segment === "idle" ? loop.versions.find(v => v.status === "champion") : null;
    const offer = seg.segment === "trialist" ? loop.offers.find(o => o.leading) : null;
    const mechanism = champion && champion.number > 0
      ? [h("strong", { class: "text-ink" }, `v${champion.number}`), ` changed the ${champion.changed}: ${champion.hypothesis} It won its test${champion.crowned_week ? ` in week ${champion.crowned_week}` : ""}.`]
      : seg.segment === "idle"
        ? ["No version beat your email clearly enough to replace it, so the AI loop kept sending your words; its edge, if any, comes from send time."]
        : [`${seg.label} keeps your words; the AI loop changes only the send time` + (offer ? ` and the offer (now favouring "${offer.label}").` : ".")];
    const differencePanel = panel("Deep dive", "What made the difference?", "Your email against the email the AI loop ended up sending, with what changed highlighted.",
      h("div", { class: "flex justify-end -mt-2 mb-4" }, stageTabs),
      h("div", { class: "grid gap-4 md:grid-cols-2" },
        emailCard("Your email", COLOUR.hand_written, yourEmail, null,
          [h("span", {}, `Timing: ${yourEmail.send_after_days < 1 ? "1 hour" : yourEmail.send_after_days + " days"} in`), h("span", {}, `${num(yours.sends)} sent · ${pct(yours.click_rate)} clicked`)], [tag("fixed", "bg-amber/10 text-amber")]),
        h("div", { class: "rounded-xl ring-1 ring-indigo/40" }, emailCard(champion ? `AI loop champion · v${champion.number}` : "AI loop, where it ended", COLOUR.ai_loop, lastWeek, yourEmail,
          [h("span", {}, `Timing: ${timing ? timing.timing + " (ahead so far)" : "learned"}`), h("span", {}, `${num(overall.sends)} sent · ${pct(overall.click_rate)} clicked`)],
          [overall.click_rate_vs_yours != null ? tag(`${pts(overall.click_rate_vs_yours)} pts clicks vs yours`, overall.click_rate_vs_yours > 0 ? "bg-win/15 text-win" : "border border-hair text-soft") : null]))),
      h("div", { class: "mt-4 rounded-md border border-hair bg-canvas p-4 text-[13px]" }, h("div", { class: "font-medium" }, "Why it changed"), h("p", { class: "text-soft mt-1" }, mechanism)),
      seg.segment === "idle" ? h("details", { class: "mt-4 group" }, h("summary", { class: "cursor-pointer text-[13px] text-soft hover:text-ink font-mono" }, `View the playbook (${loop.playbook.length} tests, ${loop.versions.length} versions)`),
        h("div", { class: "mt-4" }, playbookTable(loop))) : null);

    // 4. Timeline, every version, technical details

      collapsible(`Explore the simulation timeline (W1–W${seg.weeks.length})`, `${seg.label}: what the AI loop sent, wrote and dropped each week, and true lift so far.`, weekPlayer(seg, yourEmail), true),
      collapsible("Every version", `${seg.label}: every version and how it did against yours.`, h("div", {},
        h("div", { class: "flex justify-end mb-3" }, h("a", { href: `/api/runs/${encodeURIComponent(name)}/versions.csv`, download: `${name}-versions.csv`, class: "text-sm px-3 py-1.5 rounded border border-hair hover:border-edge" }, "Export CSV")),
        versionsTable(seg, run),
        h("p", { class: "text-xs text-faint mt-3 max-w-4xl" }, "First replay. \"Clicks vs yours\" is a version's click rate minus your email's, in points: the fair test of the words. \"Went on to\" also counts merchants who would have acted anyway. Each version's appeal is a placeholder until the AI judge reads the words (planned).")), false),
      collapsible("Technical simulation details", "Seed, replays and assumptions.", h("div", { class: "grid gap-3 sm:grid-cols-2 lg:grid-cols-4" },
        [["Seed", String(run.seed)], ["Replays", `${num(run.replays)} completed`], ["Merchants today", num(start.merchants)], ["Placeholder settings", `${num(run.placeholders)} made-up numbers`]].map(([k, v]) =>
          h("div", { class: "rounded-md border border-hair bg-shell p-3" }, h("div", { class: "text-[10px] font-mono uppercase tracking-wider text-faint" }, k), h("div", { class: "font-mono mt-1" }, v)))), false));
  };
  const onStage = e => { if (!view.contains(body)) return document.removeEventListener("stage", onStage); stageIndex = Math.max(0, run.starts[startIndex].segments.findIndex(s => s.segment === e.detail)); render(); body.children[2]?.scrollIntoView({ behavior: "smooth", block: "start" }); };
  document.addEventListener("stage", onStage);
  const startTabs = run.starts.length > 1 ? h("div", { class: "flex rounded border border-hair p-0.5 text-[12px] font-mono" }, run.starts.map((s, i) => {
    const b = h("button", { type: "button", class: "px-3 py-1.5 rounded " + (i === 0 ? "bg-elevated text-ink" : "text-soft") }, `${num(s.merchants)} merchants`);
    b.onclick = () => { startIndex = i; stageIndex = 0; startTabs.querySelectorAll("button").forEach((x, k) => x.className = "px-3 py-1.5 rounded " + (k === i ? "bg-elevated text-ink" : "text-soft")); render(); };
    return b;
  })) : null;
  view.replaceChildren(
    h("div", { class: "flex flex-wrap items-center justify-between gap-3 mb-5 fade-up" },
      h("div", { class: "flex flex-wrap items-center gap-2 text-sm" }, h("a", { href: "#/runs", class: "text-soft hover:text-ink" }, "Simulations"), h("span", { class: "text-faint" }, "/"), tag(name, "border border-indigo/40 text-indigo"), tag(`● Completed (${num(run.replays)} replays)`, "bg-win/10 text-win")),
      h("div", { class: "flex flex-wrap gap-2 items-center" }, startTabs,
        h("a", { href: `/api/runs/${encodeURIComponent(name)}/versions.csv`, download: `${name}-versions.csv`, class: "text-sm px-3 py-1.5 rounded border border-hair hover:border-edge" }, "Export CSV"),
        h("a", { href: "#/compose", class: "text-sm px-3 py-1.5 rounded border border-hair hover:border-edge" }, "New simulation"))),

  render();
}

// ---------- routing ----------
// The sidebar's "Simulation run" and "Decision brief" open the run going now, or the newest results.
async function showLatest(kind) {
  view.replaceChildren(h("div", { class: "text-soft" }, "Finding the latest run…"));
  let data; try { data = await api("/api/runs"); } catch (e) { view.replaceChildren(h("p", { class: "text-soft" }, e.message)); return; }
  if (kind === "running" && data.running.length) location.replace("#/running/" + data.running[0].run);
  else if (data.runs.length) location.replace("#/run/" + data.runs[0].run);
  else { setNav(kind === "running" ? "running" : "run", "No runs yet"); view.replaceChildren(card("p-10 text-center", h("p", { class: "text-soft" }, "No simulation has run yet."), h("a", { href: "#/compose", class: "inline-block mt-4 px-4 py-2 rounded bg-indigo text-white text-sm font-medium" }, "Write your emails and simulate"))); }
}
// A stage in the sidebar opens that stage in the results, or its email on Compose.
document.querySelectorAll("[data-stage]").forEach(li => {
  const open = () => {
    const page = (location.hash || "").split("/")[1];
    if (page === "run") document.dispatchEvent(new CustomEvent("stage", { detail: li.dataset.stage }));
    else { location.hash = "#/compose"; setTimeout(() => document.getElementById("email-" + li.dataset.stage)?.scrollIntoView({ behavior: "smooth", block: "start" }), 300); }
  };
  li.addEventListener("click", open);
  li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
});
function route() {
  clearTimers();
  const [, page, arg] = (location.hash || "#/compose").split("/");
  if (page === "latest") showLatest(arg);
  else if (page === "run" && arg) showRun(arg);
  else if (page === "running" && arg) showRunning(arg);
  else if (page === "runs") showRuns();
  else showCompose();
  window.scrollTo({ top: 0 });
}
addEventListener("hashchange", route);
route();
</script>
