      },
      fontFamily: { sans: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
    } },
  };
</script>
<style>
  body { font-feature-settings: "tnum" 1; }
  .fade-up { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .grow { transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .orbit { animation: orbit 4s linear infinite; transform-origin: 160px 110px; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .added { background: rgba(63,185,80,.16); color: #7ee2a8; border-radius: 3px; padding: 0 2px; animation: fadeUp .5s both; }
  .removed { color: #8A8F98; text-decoration: line-through; opacity: .7; }
  .chip { background: rgba(94,106,210,.16); color: #bdc2ff; border-radius: 4px; padding: 0 4px; font-family: "JetBrains Mono", monospace; font-size: .85em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .draw { stroke-dashoffset: 0; } }
  textarea, input { color-scheme: dark; }
</style>
</head>
<body class="bg-canvas text-ink font-sans antialiased selection:bg-indigo selection:text-white">
<div class="min-h-screen md:grid md:grid-cols-[232px_minmax(0,1fr)]">
  <aside class="hidden md:flex flex-col border-r border-hair bg-shell sticky top-0 h-screen">
    <a href="#/compose" class="flex items-center gap-2 px-4 h-14 border-b border-hair">
      <span class="grid place-items-center w-7 h-7 rounded-md bg-indigo/20 text-indigo">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/><rect x="8" y="9.5" width="8" height="5.5" rx="1"/><path d="m8 10 4 2.8L16 10"/></svg>
      </span>
      <span class="font-semibold">Win-back Lab</span>
    </a>
    <nav class="p-2 text-sm space-y-1" id="nav">
      <a data-nav="compose" href="#/compose" class="block px-3 py-2 rounded-md text-soft hover:text-ink hover:bg-elevated">Compose</a>
      <a data-nav="running" href="#/runs" class="block px-3 py-2 rounded-md text-soft hover:text-ink hover:bg-elevated">Simulation run</a>
      <a data-nav="run" href="#/runs" class="block px-3 py-2 rounded-md text-soft hover:text-ink hover:bg-elevated">Results &amp; versions</a>
      <a data-nav="runs" href="#/runs" class="block px-3 py-2 rounded-md text-soft hover:text-ink hover:bg-elevated">Run history</a>
    </nav>
    <div class="px-5 mt-4 text-[11px] tracking-widest text-faint font-mono">STAGES</div>
    <ul class="px-5 py-2 space-y-2 text-sm font-mono text-soft">
      <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-amber"></span>Idle</li>
      <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-indigo"></span>Drafter</li>
      <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-win"></span>Trialist</li>
    </ul>
    <p class="mt-auto p-4 text-[11px] leading-relaxed text-faint">Every number is simulated from placeholder assumptions. No real email is sent.</p>
  </aside>
  <div class="min-w-0">
    <header class="sticky top-0 z-20 h-14 flex items-center gap-3 px-4 md:px-8 border-b border-hair bg-canvas/80 backdrop-blur">
      <a href="#/compose" class="md:hidden font-semibold">Win-back Lab</a>
      <span class="text-soft text-sm hidden md:inline">Win-back Lab</span><span class="text-faint hidden md:inline">/</span>
      <span id="crumb" class="text-sm font-medium truncate"></span>
      <nav class="ml-auto flex gap-1 md:hidden text-xs">
        <a href="#/compose" class="px-2 py-1 rounded border border-hair">Compose</a>
        <a href="#/runs" class="px-2 py-1 rounded border border-hair">Runs</a>
      </nav>
    </header>
    <main id="view" class="px-4 md:px-8 py-6 md:py-8 max-w-[1280px]"></main>
  </div>
</div>
<script>
"use strict";
const STAGES = { idle: { label: "Idle", dot: "bg-amber", goal: "start a draft" }, drafter: { label: "Drafter", dot: "bg-indigo", goal: "publish" }, trialist: { label: "Trialist", dot: "bg-win", goal: "pay" } };
const COLOUR = { no_email: "#71717A", hand_written: "#F59E0B", ai_loop: "#5E6AD2" };
const NAME = { no_email: "No email", hand_written: "Your email", ai_loop: "AI loop" };
const SEND_AFTER = ["1 hour", "2 days", "5 days"];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const view = document.getElementById("view");
let timers = [];

// ---------- small helpers ----------
function h(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
function svg(tag, attrs = {}, ...kids) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  for (const k of kids.flat()) if (k) n.append(k);
  return n;
}
const pts = v => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1);
const pct = v => v == null ? "–" : (100 * v).toFixed(1) + "%";
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const num = v => Number(v).toLocaleString("en-US");
const day = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
// A card; an optional plain object after the classes holds extra attributes (such as an animation delay).
const card = (cls, ...kids) => {
  const attrs = kids[0] && kids[0].constructor === Object ? kids.shift() : {};
  return h("section", { ...attrs, class: "bg-card border border-hair rounded-xl fade-up " + (cls || "") }, ...kids);
};
const label = text => h("div", { class: "text-[11px] tracking-widest uppercase text-faint font-mono" }, text);
function store(key, value) { try { if (value === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(value)); } catch { return null; } }
async function api(path, options) {
  const r = await fetch(path, options);
  const t = await r.text();
  let b; try { b = JSON.parse(t); } catch { b = t; }
  if (!r.ok) throw new Error((b && b.error) || "Something went wrong (" + r.status + ")");
  return b;
}
function countUp(el, to, fmt) {
  if (reduced) { el.textContent = fmt(to); return; }
  const start = performance.now();
  const tick = now => { const p = Math.min(1, (now - start) / 900); el.textContent = fmt(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
// Text with {placeholders} shown as chips; all text goes in as text, never as markup.
function withChips(text) {
  return text.split(/(\{[a-z_]+\})/g).filter(Boolean).map(part => /^\{[a-z_]+\}$/.test(part) ? h("span", { class: "chip" }, part) : part);
}
// Word-level difference between two texts: kept words plain, new words highlighted, removed words struck.
function diffWords(before, after) {
  const a = before.split(/(\s+)/), b = after.split(/(\s+)/);
  const m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  // Mostly rewritten: word-by-word marks would be noise, so show the new words whole and the old ones below.
  const words = s => s.filter(w => !/^\s+$/.test(w)).length;
  if (L[0][0] / 2 < 0.4 * Math.max(words(a), words(b))) {
    return [h("span", { class: "added" }, withChips(after)), h("span", { class: "block mt-1 text-xs removed" }, before)];
  }
  const out = []; let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && a[i] === b[j]) { out.push(h("span", {}, withChips(b[j]))); i++; j++; }
    else if (j < n && (i >= m || L[i][j + 1] >= L[i + 1][j])) { out.push(/^\s+$/.test(b[j]) ? b[j] : h("span", { class: "added" }, withChips(b[j]))); j++; }
    else { if (!/^\s+$/.test(a[i])) out.push(h("span", { class: "removed" }, a[i]), " "); i++; }
  }
  return out;
}
function delta(v, unit = " pts") {
  if (v == null) return h("span", { class: "text-faint" }, "–");
  const cls = v > 0.05 ? "text-win" : v < -0.05 ? "text-soft" : "text-soft";
  return h("span", { class: "font-mono " + cls }, pts(v) + unit);
}
function setNav(name, crumb) {
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("bg-elevated", a.dataset.nav === name));
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("text-ink", a.dataset.nav === name));
  document.getElementById("crumb").textContent = crumb;
}
function clearTimers() { timers.forEach(clearInterval); timers = []; }

// ---------- Compose ----------
async function showCompose() {
  setNav("compose", "Write your emails");
  view.replaceChildren(h("div", { class: "text-soft" }, "Loading your drafts…"));
  let emails = store("winback-emails");
  if (!emails) { try { emails = (await api("/api/drafts")).emails; } catch (e) { view.replaceChildren(h("p", { class: "text-soft" }, e.message)); return; } }
  const settings = store("winback-run") || { replays: 20 };
  const save = () => store("winback-emails", emails);

  const editor = (email, index) => {
    const stage = STAGES[email.segment];
    const preview = h("div");
    const render = () => preview.replaceChildren(
      h("div", { class: "font-semibold text-ink truncate" }, withChips(email.subject || " ")),
      h("div", { class: "text-soft text-sm mt-1 leading-relaxed" }, withChips(email.body || " ")),
      h("span", { class: "inline-block mt-3 text-sm px-3 py-1.5 rounded-md bg-ink text-canvas font-medium" }, email.cta || " ", " →"));
    render();
    const field = (key, area) => {
      const attrs = { class: "w-full bg-shell border border-hair rounded-lg px-3 py-2 text-[15px] focus:outline-none focus:border-indigo/70 focus:ring-2 focus:ring-indigo/20 transition", value: email[key], "aria-label": key };
      const input = area ? h("textarea", { ...attrs, rows: 6 }) : h("input", attrs);
      if (area) input.value = email[key];
      input.addEventListener("input", () => { email[key] = input.value; save(); render(); });
      return input;
    };
    const timing = h("div", { class: "flex rounded-lg border border-hair p-0.5 text-xs" }, SEND_AFTER.map(t => {
      const b = h("button", { class: "px-2.5 py-1 rounded-md transition " + (email.send_after === t ? "bg-elevated text-ink" : "text-soft hover:text-ink"), type: "button" }, t);
      b.onclick = () => { email.send_after = t; save(); showCompose(); };
      return b;
    }));
    return card("flex flex-col overflow-hidden", { style: `animation-delay:${index * 70}ms` },
      h("div", { class: "flex items-center justify-between gap-2 px-5 py-4 border-b border-hair" },
        h("div", { class: "flex items-center gap-2 font-mono text-sm" }, h("span", { class: `w-2 h-2 rounded-full ${stage.dot}` }), stage.label),
        h("span", { class: "text-xs px-2 py-0.5 rounded border border-hair text-soft" }, "Goal: " + stage.goal)),
      h("div", { class: "p-5 space-y-4 flex-1" },
        h("div", { class: "flex items-center justify-between gap-3" }, h("span", { class: "text-sm text-soft" }, "Send after"), timing),
        h("div", {}, label("Subject line"), h("div", { class: "mt-1.5" }, field("subject"))),
        h("div", {}, label("Body"), h("div", { class: "mt-1.5" }, field("body", true))),
        h("div", {}, label("Button"), h("div", { class: "mt-1.5" }, field("cta")))),
      h("div", { class: "px-5 py-4 border-t border-hair bg-shell/60" }, label("Inbox preview"), h("div", { class: "mt-2 p-4 rounded-lg bg-elevated border border-hair" }, preview)));
  };

  const code = h("input", { type: "password", autocomplete: "off", placeholder: "Access code", value: store("winback-code") || "", class: "bg-shell border border-hair rounded-lg px-3 py-2 text-sm w-40 focus:outline-none focus:border-indigo/70" });
  const size = h("div", { class: "flex rounded-lg border border-hair p-0.5 text-xs" }, [[20, "Quick · 20 replays"], [200, "Full · 200 replays"]].map(([n, t]) => {
    const b = h("button", { type: "button", class: "px-3 py-1.5 rounded-md " + (settings.replays === n ? "bg-elevated text-ink" : "text-soft hover:text-ink") }, t);
    b.onclick = () => { store("winback-run", { replays: n }); showCompose(); };
    return b;
  }));
  const status = h("span", { class: "text-sm text-soft", role: "status" });
  const go = h("button", { type: "button", class: "px-5 py-2.5 rounded-lg bg-indigo hover:bg-indigo/90 text-white font-medium shadow-lg shadow-indigo/20 transition" }, "Simulate 13 weeks");
  go.onclick = async () => {
    store("winback-code", code.value.trim());
    go.disabled = true; status.textContent = "Starting…";
    try {
      const started = await api("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: code.value.trim(), replays: settings.replays, emails }) });
      location.hash = "#/running/" + started.run;
    } catch (e) { status.textContent = e.message; go.disabled = false; }
  };
  const reset = h("button", { type: "button", class: "text-sm text-soft hover:text-ink underline-offset-4 hover:underline" }, "Reset to the saved drafts");
  reset.onclick = () => { store("winback-emails", null); try { localStorage.removeItem("winback-emails"); } catch {} showCompose(); };

  view.replaceChildren(
    h("div", { class: "fade-up flex flex-col md:flex-row md:items-end gap-4 justify-between" },
      h("div", {}, h("h1", { class: "text-3xl md:text-4xl font-semibold tracking-tight" }, "Write your emails"),
        h("p", { class: "text-soft mt-2 max-w-2xl" }, "One email per stage. The simulation sends yours to the same merchants as an AI loop that starts from your words and keeps rewriting them, then shows every version and how it did against yours.")),
      reset),
    h("div", { class: "grid gap-4 mt-6 lg:grid-cols-3" }, emails.map(editor)),
    card("mt-6 p-4 flex flex-col md:flex-row md:items-center gap-3 sticky bottom-4 shadow-2xl shadow-black/40 bg-elevated/95 backdrop-blur",
      h("div", { class: "text-sm text-soft flex-1" }, "Your words are what gets sent and compared. How appealing they are is a placeholder until the AI judge reads them (planned); the send time you pick changes results now."),
      size, code, go, status));
}

// ---------- Running ----------
async function showRunning(name) {
  setNav("running", "Simulation running");
  const startedAt = Date.now();
  const elapsed = h("span", { class: "font-mono text-soft" }, "0:00");
  const loop = svg("svg", { viewBox: "0 0 320 220", class: "w-full max-w-sm mx-auto", "aria-hidden": "true" },
    svg("circle", { cx: 160, cy: 110, r: 70, fill: "none", stroke: "rgba(255,255,255,.08)", "stroke-dasharray": "3 6" }),
    svg("g", { class: "orbit" }, ...[0, 72, 144, 216, 288].map((a, i) => svg("rect", { x: 152, y: 34, width: 16, height: 11, rx: 2, fill: ["#F59E0B", "#5E6AD2", "#3FB950", "#5E6AD2", "#F59E0B"][i], transform: `rotate(${a} 160 110)`, opacity: .9 }))),
    svg("rect", { x: 138, y: 92, width: 44, height: 36, rx: 6, fill: "#17181C", stroke: "rgba(255,255,255,.16)" }),
    svg("path", { d: "M146 104h28M146 112h20M146 120h24", stroke: "#8A8F98", "stroke-width": 2, "stroke-linecap": "round" }));
  const steps = ["Merchants arrive", "Emails go out", "Results come back"].map((t, i) => h("div", { class: "flex items-center gap-2 text-sm text-soft", "data-step": i }, h("span", { class: "w-2 h-2 rounded-full bg-faint" }), t));
  view.replaceChildren(card("max-w-xl mx-auto mt-6 md:mt-16 p-8 text-center",
    loop,
    h("h1", { class: "text-2xl font-semibold mt-6" }, "Playing out 13 weeks, many times over"),
    h("p", { class: "text-soft mt-2" }, "Comparing no email, your email and the AI loop on the same merchants. A quick run takes about a minute, a full one a few minutes."),
    h("div", { class: "mt-6 h-0.5 bg-hair rounded overflow-hidden" }, h("div", { class: "h-full w-1/3 bg-indigo pulse-dot" })),
    h("div", { class: "mt-4 flex justify-between items-center" }, h("div", { class: "flex gap-4 flex-wrap" }, steps), elapsed)));
  clearTimers();
  timers.push(setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    elapsed.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    const active = Math.min(2, Math.floor(s / 8) % 3);
    steps.forEach((el, i) => { el.firstChild.className = "w-2 h-2 rounded-full " + (i === active ? "bg-indigo pulse-dot" : i < active ? "bg-win" : "bg-faint"); el.classList.toggle("text-ink", i === active); });
  }, 1000));
  timers.push(setInterval(async () => {
    try { const runs = await api("/api/runs"); if (runs.runs.some(r => r.run === name)) location.hash = "#/run/" + name; } catch {}
  }, 5000));
}

// ---------- History ----------
async function showRuns() {
  setNav("runs", "Run history");
  view.replaceChildren(h("div", { class: "text-soft" }, "Loading runs…"));
  let data; try { data = await api("/api/runs"); } catch (e) { view.replaceChildren(h("p", { class: "text-soft" }, e.message)); return; }
  const row = (cells, link, i) => h(link ? "a" : "div", { href: link, class: "grid grid-cols-1 md:grid-cols-[1.2fr_2fr_auto] gap-3 items-center px-5 py-4 border-t border-hair hover:bg-elevated/60 transition fade-up", style: `animation-delay:${i * 40}ms` }, cells);
  const rows = [
    ...data.running.map((r, i) => row([
      h("div", { class: "flex items-center gap-2" }, h("span", { class: "w-2 h-2 rounded-full bg-indigo pulse-dot" }), h("span", { class: "font-medium" }, "Running now"), h("span", { class: "text-soft text-sm" }, `${r.replays} replays`)),
      h("div", { class: "text-soft text-sm" }, "Results on the way"), h("span", { class: "text-xs font-mono px-2 py-1 rounded bg-indigo/15 text-indigo" }, "RUNNING")], "#/running/" + r.run, i)),
    ...data.runs.map((r, i) => {
      const first = (r.headline || [])[0];
      return row([
        h("div", {}, h("div", { class: "font-medium" }, day(r.created)), h("div", { class: "text-xs font-mono text-faint" }, `seed ${r.seed} · ${r.replays} replays`)),
        h("div", { class: "flex flex-wrap gap-2" }, (first ? first.segments : []).map(s => h("span", { class: "text-xs font-mono px-2 py-1 rounded border " + (s.ai_did_better ? "border-win/40 text-win" : "border-hair text-soft") }, `${s.label} ${pts(s.ai)} vs ${pts(s.hand)}`))),
        h("span", { class: "text-soft" }, "→")], "#/run/" + r.run, i + data.running.length);
    }),
  ];
  const fresh = h("a", { href: "#/compose", class: "px-4 py-2 rounded-lg bg-ink text-canvas text-sm font-medium" }, "New simulation");
  view.replaceChildren(
    h("div", { class: "flex items-end justify-between gap-4 fade-up" }, h("div", {}, h("h1", { class: "text-3xl font-semibold tracking-tight" }, "Runs"), h("p", { class: "text-soft mt-1" }, "Every simulation, weekly runs included. AI loop against your email, in points of true lift.")), fresh),
    card("mt-6 overflow-hidden", rows.length ? rows : h("div", { class: "p-10 text-center text-soft" }, "No runs yet. Write your emails and press Simulate.")));
}

// ---------- Results ----------
function lineChart(weekly, upTo) {
  const W = 640, H = 220, pad = { l: 36, r: 12, t: 12, b: 26 };
  const series = Object.keys(NAME).map(a => weekly[a].map(v => v));
  const all = series.flat().filter(v => v != null), max = Math.max(0.5, ...all), min = Math.min(0, ...all);
  const n = series[0].length, x = i => pad.l + (W - pad.l - pad.r) * i / (n - 1), y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - min) / (max - min));
  const known = weekly.ai_loop.findIndex((v, i) => v !== 0 || weekly.hand_written[i] !== 0);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "w-full h-auto", role: "img", "aria-label": "True lift so far, week by week, for no email, your email and the AI loop" });

  for (let i = 0; i < n; i += 2) s.append(svg("text", { x: x(i), y: H - 6, fill: "#5E626A", "font-size": 10, "text-anchor": "middle", "font-family": "JetBrains Mono" }, document.createTextNode("W" + (i + 1))));

}

function journey(start) {
  const [idle, drafter, trialist] = start.segments;
  const steps = ["Signed up", "Started a draft", "Published", "Paid"];
  const count = { no_email: [], hand_written: [], ai_loop: [] };
  for (const a of Object.keys(NAME)) count[a] = [idle.funnel[a].merchants, idle.funnel[a].reached, drafter.funnel[a].reached, trialist.funnel[a].reached];
  const W = 900, H = 260, colX = i => 60 + i * (W - 120) / 3;
  const top = Math.max(...Object.values(count).map(c => c[0]));
  const y = (a, v) => 40 + ({ ai_loop: 0, hand_written: 62, no_email: 124 })[a] + 50 * (1 - v / top);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "w-full h-auto", role: "img", "aria-label": "Merchants at each step of the journey for each approach" });
  steps.forEach((t, i) => s.append(svg("text", { x: colX(i), y: 18, fill: "#8A8F98", "font-size": 12, "text-anchor": "middle" }, document.createTextNode(t))));
  for (const a of ["no_email", "hand_written", "ai_loop"]) {
    const d = count[a].map((v, i) => `${i ? "L" : "M"}${colX(i)},${y(a, v)}`).join(" ");
    s.append(svg("path", { d, fill: "none", stroke: COLOUR[a], "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .85, class: "draw", style: "--len:1400" }));
    count[a].forEach((v, i) => { if (i) s.append(svg("text", { x: colX(i), y: y(a, v) - 10, fill: COLOUR[a], "font-size": 12, "font-family": "JetBrains Mono", "text-anchor": "middle" }, document.createTextNode(num(v)))); });
  }
  return { svg: s, count };
}

          emailCard("AI loop, where it ended", COLOUR.ai_loop, last, yourEmail, h("span", {}, `${num(overall.sends)} sent · ${pct(overall.click_rate)} clicked · `, delta(overall.click_rate_vs_yours), " clicks vs yours"), [tag("vs your email", "text-faint")]))),

    h("ul", { class: "mt-4 mb-6 space-y-1 text-sm text-soft max-w-4xl fade-up" }, run.summary.slice(2).filter(s => s.startsWith("In ")).slice(0, 3).map(s => h("li", {}, s))),

// ---------- routing ----------
function route() {
  clearTimers();
  const [, page, arg] = (location.hash || "#/compose").split("/");
  if (page === "run" && arg) showRun(arg);
  else if (page === "running" && arg) showRunning(arg);
  else if (page === "runs") showRuns();
  else showCompose();
  window.scrollTo({ top: 0 });
}
addEventListener("hashchange", route);
route();
