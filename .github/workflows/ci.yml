name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Type check
        run: uv run mypy
